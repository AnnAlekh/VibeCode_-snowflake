<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
  <defs>
    <linearGradient id="flow-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #102030; }
      .actor { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #102030; }
      .phase-label { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #0d4b82; }
      .step { font: 500 13px "Segoe UI", Arial, sans-serif; fill: #1c2d3f; }
      .lifeline { stroke: #9fb3c8; stroke-dasharray: 8 6; stroke-width: 2; }
      .message { stroke: #1f4a82; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .response { stroke-dasharray: 5 5; }
      .phase { fill: rgba(13, 75, 130, 0.07); stroke: #0d4b82; stroke-width: 1.5; rx: 12; ry: 12; }
      .lane { fill: rgba(255,255,255,0.75); stroke: rgba(0,0,0,0.08); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f4a82"/>
    </marker>
  </defs>
  <rect width="1280" height="780" fill="url(#flow-bg)"/>
  <text x="640" y="48" text-anchor="middle" class="title">Процесс типичного интервью</text>

  <!-- Swimlanes -->
  <g transform="translate(0,80)">
    <rect class="lane" x="40" y="0" width="1200" height="620" fill="rgba(255,255,255,0.9)"/>
    <text x="90" y="30" class="actor">Кандидат</text>
    <text x="260" y="30" class="actor">Client UI</text>
    <text x="460" y="30" class="actor">Backend API</text>
    <text x="680" y="30" class="actor">LLM/Аналитика</text>
    <text x="900" y="30" class="actor">Sandbox</text>
    <text x="1120" y="30" class="actor">Отчет</text>

    <!-- Lifelines -->
    <line class="lifeline" x1="90" y1="40" x2="90" y2="640"/>
    <line class="lifeline" x1="260" y1="40" x2="260" y2="640"/>
    <line class="lifeline" x1="460" y1="40" x2="460" y2="640"/>
    <line class="lifeline" x1="680" y1="40" x2="680" y2="640"/>
    <line class="lifeline" x1="900" y1="40" x2="900" y2="640"/>
    <line class="lifeline" x1="1120" y1="40" x2="1120" y2="640"/>

    <!-- Phase blocks -->
    <rect class="phase" x="70" y="60" width="1100" height="120"/>
    <text class="phase-label" x="90" y="80">Фаза 1 · Запрос задачи</text>

    <rect class="phase" x="70" y="210" width="1100" height="140"/>
    <text class="phase-label" x="90" y="230">Фаза 2 · Решение и тесты</text>

    <rect class="phase" x="70" y="370" width="1100" height="150"/>
    <text class="phase-label" x="90" y="390">Фаза 3 · Анализ и адаптация</text>

    <rect class="phase" x="70" y="540" width="1100" height="120"/>
    <text class="phase-label" x="90" y="560">Фаза 4 · Финальный отчет</text>

    <!-- Phase 1 messages -->
    <path class="message" d="M90 110 L250 110"/>
    <text class="step" x="170" y="98" text-anchor="middle">Выбор уровня</text>

    <path class="message" d="M260 135 L450 135"/>
    <text class="step" x="355" y="123" text-anchor="middle">POST /tasks/generate</text>

    <path class="message" d="M460 160 L660 160"/>
    <text class="step" x="560" y="148" text-anchor="middle">TaskGenerator → LLM</text>

    <path class="message response" d="M660 185 L460 185"/>
    <text class="step" x="560" y="173" text-anchor="middle">Stream задачи + тесты</text>

    <path class="message response" d="M460 200 L260 200"/>
    <text class="step" x="360" y="188" text-anchor="middle">JSON условия + подсказки</text>

    <!-- Phase 2 -->
    <path class="message" d="M90 250 L250 250"/>
    <text class="step" x="170" y="238" text-anchor="middle">Правка кода в IDE</text>

    <path class="message" d="M260 275 L450 275"/>
    <text class="step" x="355" y="263" text-anchor="middle">POST /runtime/execute</text>

    <path class="message" d="M460 300 L880 300"/>
    <text class="step" x="670" y="288" text-anchor="middle">Код в sandbox</text>

    <path class="message response" d="M900 325 L460 325"/>
    <text class="step" x="680" y="313" text-anchor="middle">stdout/stderr + скрытые тесты</text>

    <path class="message response" d="M460 350 L260 350"/>
    <text class="step" x="360" y="338" text-anchor="middle">Результаты и подсветка ошибок</text>

    <!-- Phase 3 -->
    <path class="message" d="M90 410 L250 410"/>
    <text class="step" x="170" y="398" text-anchor="middle">Отправка решения</text>

    <path class="message" d="M260 435 L450 435"/>
    <text class="step" x="355" y="423" text-anchor="middle">POST /solutions/submit</text>

    <path class="message" d="M460 460 L660 460"/>
    <text class="step" x="560" y="448" text-anchor="middle">SolutionAnalyzer</text>

    <path class="message response" d="M660 485 L460 485"/>
    <text class="step" x="560" y="473" text-anchor="middle">Оценка correctness / quality</text>

    <path class="message" d="M460 510 L660 510"/>
    <text class="step" x="560" y="498" text-anchor="middle">LevelAssessor + AdaptiveSelector</text>

    <path class="message response" d="M460 535 L260 535"/>
    <text class="step" x="360" y="523" text-anchor="middle">Новая задача + вопросы</text>

    <!-- Chat loop -->
    <path class="message response" d="M90 560 L250 560"/>
    <text class="step" x="170" y="548" text-anchor="middle">Ответы кандидата</text>

    <path class="message response" d="M260 585 L450 585"/>
    <text class="step" x="355" y="573" text-anchor="middle">Чат-сообщения</text>

    <!-- Phase 4 -->
    <path class="message" d="M460 600 L1110 600"/>
    <text class="step" x="785" y="588" text-anchor="middle">ReportBuilder → финальный отчет</text>

    <path class="message response" d="M1120 625 L260 625"/>
    <text class="step" x="690" y="613" text-anchor="middle">Скачивание PDF/JSON</text>

    <path class="message response" d="M260 650 L90 650"/>
    <text class="step" x="175" y="638" text-anchor="middle">Финальные рекомендации</text>
  </g>
</svg>

