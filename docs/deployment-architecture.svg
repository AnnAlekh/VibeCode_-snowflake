<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="deploy-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4fff4"/>
      <stop offset="1" stop-color="#f6f6ff"/>
    </linearGradient>
    <style>
      .title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #103015; }
      .section { font: 600 16px "Segoe UI", Arial, sans-serif; fill: #103015; }
      .label { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #103015; }
      .desc { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #2c3e27; }
      .panel { rx: 18; ry: 18; stroke-width: 2; }
      .arrow { stroke: #2c5d1f; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .arrow-text { font: 500 12px "Segoe UI", Arial, sans-serif; fill: #2c5d1f; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c5d1f"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#deploy-bg)"/>
  <text x="640" y="48" text-anchor="middle" class="title">Диаграмма деплоя и окружения</text>

  <!-- Left column -->
  <rect x="40" y="90" width="260" height="540" class="panel" fill="#f0fff0" stroke="#5aaa3f"/>
  <text x="170" y="120" class="section" text-anchor="middle">Development</text>
  <g>
    <rect x="70" y="150" width="200" height="90" rx="14" ry="14" fill="#fff" stroke="#a8d68c"/>
    <text x="170" y="185" class="label" text-anchor="middle">Dev workstation</text>
    <text x="170" y="205" class="desc" text-anchor="middle">IDE · scripts · git</text>
  </g>
  <g>
    <rect x="70" y="260" width="200" height="90" rx="14" ry="14" fill="#fff" stroke="#a8d68c"/>
    <text x="170" y="295" class="label" text-anchor="middle">Monorepo</text>
    <text x="170" y="315" class="desc" text-anchor="middle">`vibecode jam`</text>
  </g>
  <g>
    <rect x="70" y="370" width="200" height="90" rx="14" ry="14" fill="#fff" stroke="#a8d68c"/>
    <text x="170" y="405" class="label" text-anchor="middle">Docker Compose</text>
    <text x="170" y="425" class="desc" text-anchor="middle">build + orchestration</text>
  </g>

  <!-- Local host -->
  <rect x="330" y="90" width="480" height="540" class="panel" fill="#fffef2" stroke="#f08c00"/>
  <text x="570" y="120" class="section" text-anchor="middle">Local host</text>

  <g>
    <rect x="360" y="150" width="420" height="150" rx="14" ry="14" fill="#fff" stroke="#f2b777"/>
    <text x="570" y="180" class="label" text-anchor="middle">Docker containers</text>
    <text x="570" y="200" class="desc" text-anchor="middle">Backend API · Web static server · Storage</text>
    <line x1="400" y1="210" x2="400" y2="270" stroke="#f2b777"/>
    <line x1="570" y1="210" x2="570" y2="270" stroke="#f2b777"/>
    <line x1="740" y1="210" x2="740" y2="270" stroke="#f2b777"/>
    <text x="400" y="250" class="desc" text-anchor="middle">backend</text>
    <text x="570" y="250" class="desc" text-anchor="middle">web-static</text>
    <text x="740" y="250" class="desc" text-anchor="middle">mongo/storage</text>
  </g>

  <g>
    <rect x="360" y="330" width="420" height="130" rx="14" ry="14" fill="#fff" stroke="#f2b777"/>
    <text x="570" y="365" class="label" text-anchor="middle">Native processes</text>
    <text x="570" y="385" class="desc" text-anchor="middle">Electron shell · Sandbox executors</text>
    <text x="450" y="430" class="desc" text-anchor="middle">Electron</text>
    <text x="690" y="430" class="desc" text-anchor="middle">Sandbox (python/node)</text>
  </g>

  <g>
    <rect x="360" y="480" width="420" height="130" rx="14" ry="14" fill="#fff" stroke="#f2b777"/>
    <text x="570" y="515" class="label" text-anchor="middle">Local networking</text>
    <text x="570" y="535" class="desc" text-anchor="middle">http://localhost:3000 · file sockets</text>
  </g>

  <!-- External -->
  <rect x="840" y="90" width="400" height="540" class="panel" fill="#eef2ff" stroke="#5a6df5"/>
  <text x="1040" y="120" class="section" text-anchor="middle">External services</text>

  <g>
    <rect x="870" y="150" width="340" height="120" rx="14" ry="14" fill="#fff" stroke="#9ca7ff"/>
    <text x="1040" y="190" class="label" text-anchor="middle">Scibox LLM API</text>
    <text x="1040" y="210" class="desc" text-anchor="middle">qwen3-32b-awq · HTTPS</text>
  </g>

  <g>
    <rect x="870" y="300" width="340" height="120" rx="14" ry="14" fill="#fff" stroke="#9ca7ff"/>
    <text x="1040" y="340" class="label" text-anchor="middle">Monaco / CDN</text>
    <text x="1040" y="360" class="desc" text-anchor="middle">static assets / fonts</text>
  </g>

  <g>
    <rect x="870" y="450" width="340" height="120" rx="14" ry="14" fill="#fff" stroke="#9ca7ff"/>
    <text x="1040" y="490" class="label" text-anchor="middle">Optional cloud storage</text>
    <text x="1040" y="510" class="desc" text-anchor="middle">reports · backups</text>
  </g>

  <!-- Flows -->
  <path class="arrow" d="M240 195 L330 195"/>
  <text class="arrow-text" x="285" y="180">git pull / edit</text>

  <path class="arrow" d="M240 305 L330 305"/>
  <text class="arrow-text" x="285" y="290">docker compose build</text>

  <path class="arrow" d="M240 415 L330 415"/>
  <text class="arrow-text" x="285" y="400">docker compose up</text>

  <path class="arrow" d="M780 225 L870 205"/>
  <text class="arrow-text" x="830" y="190">HTTPS LLM calls</text>

  <path class="arrow" d="M780 360 L870 360"/>
  <text class="arrow-text" x="825" y="345">Static assets</text>

  <path class="arrow" d="M780 520 L870 510"/>
  <text class="arrow-text" x="825" y="500">Artifact upload</text>

  <path class="arrow" d="M510 460 L450 460" stroke-dasharray="6 4" stroke="#f08c00"/>
  <text class="arrow-text" x="480" y="448">IPC</text>

  <path class="arrow" d="M600 460 L660 460" stroke-dasharray="6 4" stroke="#f08c00"/>
  <text class="arrow-text" x="630" y="448">stdin/stdout</text>
</svg>

